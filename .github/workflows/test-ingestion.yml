name: Test Ingestion

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - scripts/**
      - tests/**
      - schema.sql
      - requirements.txt
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify live refresh keeps every half-hour slot
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
