name = "ews-refresh-trigger"
main = "workers/refresh-trigger.js"
compatibility_date = "2026-05-05"
workers_dev = false

[vars]
GITHUB_REPOSITORY = "kylemcdonald/ews"
GITHUB_REF = "main"

# The only scheduler for the repository's workflows; SCHEDULES in the worker says which window each
# tick serves (the live refresh at :05/:35 with a retry at :20/:50, plus two daily jobs).
# GITHUB_DISPATCH_TOKEN is a fine-grained token limited to Actions read/write on this repository.
[triggers]
crons = ["5,20,35,50 * * * *"]
